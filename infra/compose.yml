services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: research
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research"]
      interval: 5s
      retries: 10
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    ports: ["127.0.0.1:6379:6379"]
  qdrant:
    image: ${QDRANT_IMAGE:-ghcr.io/qdrant/qdrant/qdrant:v1.20.0}
    ports: ["127.0.0.1:6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:8.17.10}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["127.0.0.1:9200:9200"]
    volumes: [elasticsearch_data:/usr/share/elasticsearch/data]
  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [minio_data:/data]
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://research:${POSTGRES_PASSWORD}@postgres:5432/research
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      QDRANT_URL: http://qdrant:6333
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    command: uv run --locked celery -A services.api.app.worker.celery_app worker -l info -Q default
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://research:${POSTGRES_PASSWORD}@postgres:5432/research
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      QDRANT_URL: http://qdrant:6333
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on: [api]
  parser:
    profiles: ["cloud"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    command: uv run --locked celery -A services.api.app.worker.celery_app worker -l info -Q parser --pool=threads --concurrency=${PARSER_CONCURRENCY:-2}
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://research:${POSTGRES_PASSWORD}@postgres:5432/research
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      QDRANT_URL: http://qdrant:6333
      ELASTICSEARCH_URL: http://elasticsearch:9200
      PARSER_BACKEND: remote
    depends_on: [api]
  beat:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    command: uv run --locked celery -A services.api.app.worker.celery_app beat -l info
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://research:${POSTGRES_PASSWORD}@postgres:5432/research
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      QDRANT_URL: http://qdrant:6333
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on: [api]
  web:
    build:
      context: ../apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
  caddy:
    profiles: ["cloud"]
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
volumes:
  postgres_data:
  qdrant_data:
  elasticsearch_data:
  minio_data:
  caddy_data:
  caddy_config:

[project]
name = "ai-research-agent"
version = "0.1.0"
description = "Evidence-first academic research assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "beautifulsoup4>=4.12,<5",
  "boto3>=1.35,<2",
  "celery[redis]>=5.4,<6",
  "cryptography>=43,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "matplotlib>=3.9,<4",
  "networkx>=3.4,<4",
  "numpy>=2,<3",
  "openai>=1.60,<3",
  "pandas>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pymupdf>=1.25,<2",
  "python-multipart>=0.0.20,<1",
  "qdrant-client>=1.13,<2",
  "socksio>=1.0.0",
  "sqlalchemy>=2.0,<3",
  "sse-starlette>=2.2,<4",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
parser = ["mineru>=4,<5"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pytest-asyncio>=0.25,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]
exclude = ["services/api/tests/**", "services/api/migrations/**"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["services/api/tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008", "BLE001", "S112", "FURB167"]
